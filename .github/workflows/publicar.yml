# Comprueba y publica la web en GitHub Pages en cada push a la rama main.
# Si los tests o la compilación fallan, no se publica nada y la versión anterior sigue en línea.
name: Comprobar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se hacen dos push seguidos, solo se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  comprobar:
    name: Tests y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    needs: comprobar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
