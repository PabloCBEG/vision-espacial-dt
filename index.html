<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Visión espacial · Dibujo Técnico</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Sin acceso a localStorage: se usa el tema del sistema.
      }
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="/favicon.svg" alt="" width="36" height="36" />
        <h1 class="app-title">Visión espacial · Dibujo Técnico</h1>
      </div>
      <div class="header-actions">
        <button id="projector-toggle" class="header-button" type="button" aria-pressed="false">
          Modo proyector
        </button>
        <button id="theme-toggle" class="header-button" type="button" aria-pressed="false">
          Tema oscuro
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel-3d" aria-labelledby="panel-3d-title">
        <div class="panel-header">
          <h2 id="panel-3d-title" class="panel-title">Modelo 3D</h2>
          <div id="view-buttons" class="view-buttons" role="group" aria-label="Vistas rápidas">
            <button type="button" data-view="perspective" aria-pressed="true">Perspectiva</button>
            <button type="button" data-view="front" aria-pressed="false">Frontal</button>
            <button type="button" data-view="top" aria-pressed="false">Superior</button>
            <button type="button" data-view="profile" aria-pressed="false">Perfil</button>
          </div>
        </div>

        <div
          id="view-3d"
          class="view-3d"
          role="img"
          aria-label="Modelo en el espacio: planos de proyección PH y PV, línea de tierra y punto P con sus proyecciones"
        >
          <p class="placeholder">Cargando el modelo 3D…</p>
        </div>
        <p id="explain-caption" class="explain-caption" aria-live="polite" hidden></p>
      </section>

      <section class="panel panel-2d" aria-labelledby="panel-2d-title">
        <div class="panel-header">
          <h2 id="panel-2d-title" class="panel-title">Lámina</h2>
          <div id="sheet-zoom" class="view-buttons" role="group" aria-label="Zoom de la lámina">
            <button type="button" data-zoom="in" aria-label="Acercar">+</button>
            <button type="button" data-zoom="out" aria-label="Alejar">−</button>
            <button type="button" data-zoom="fit">Encuadrar</button>
          </div>
        </div>
        <div id="view-2d" class="view-2d">
          <p class="placeholder">Cargando la lámina…</p>
        </div>
      </section>

      <section class="controls-bar" aria-label="Controles del punto">
        <p id="point-description" class="visually-hidden" aria-live="polite"></p>
        <form id="point-controls" class="point-controls" aria-label="Coordenadas del punto P">
          <p class="point-hint">
            Mueve P con los deslizadores o arrastra P, P′ o P″ en el modelo o en la lámina.
          </p>
          <div class="slider">
            <label for="slider-x">x</label>
            <output data-axis="x" for="slider-x"></output>
            <input id="slider-x" name="x" type="range" min="-60" max="60" step="1" />
          </div>
          <div class="slider">
            <label for="slider-a">Alejamiento (a)</label>
            <output data-axis="a" for="slider-a"></output>
            <input id="slider-a" name="a" type="range" min="-60" max="60" step="1" />
          </div>
          <div class="slider">
            <label for="slider-c">Cota (c)</label>
            <output data-axis="c" for="slider-c"></output>
            <input id="slider-c" name="c" type="range" min="-60" max="60" step="1" />
          </div>
        </form>

        <div id="fold-controls" class="fold-controls" role="group" aria-label="Abatimiento del PH">
          <div class="slider">
            <label for="slider-fold">Abatir PH</label>
            <output id="output-fold" for="slider-fold">0°</output>
            <input id="slider-fold" type="range" min="0" max="90" step="1" value="0" />
          </div>
          <div class="fold-buttons">
            <button id="fold-play" type="button" class="action-button">
              Reproducir abatimiento
            </button>
            <button id="explain-toggle" type="button" class="action-button" aria-pressed="false">
              Explicar
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
