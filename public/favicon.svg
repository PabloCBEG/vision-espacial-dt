<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Visión espacial</title>
  <defs>
    <!-- Interior de la esfera: oscuro en el centro, azul violeta hacia el borde -->
    <radialGradient id="body" cx="0.46" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#05093a" />
      <stop offset="0.55" stop-color="#1a1f9e" />
      <stop offset="0.85" stop-color="#4b3ee0" />
      <stop offset="1" stop-color="#2fa8ff" />
    </radialGradient>
    <!-- Borde iridiscente -->
    <linearGradient id="rim" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#5ff3ff" />
      <stop offset="0.35" stop-color="#3a7bff" />
      <stop offset="0.6" stop-color="#c06bff" />
      <stop offset="0.8" stop-color="#ff9ad5" />
      <stop offset="1" stop-color="#ffcf7a" />
    </linearGradient>
    <!-- Brillo superior derecho -->
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Reflejo interior en arco -->
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#4fe3ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#03041a" />

  <!-- Halo -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#5a6bff" stroke-width="4" opacity="0.55" filter="url(#glow)" />

  <!-- Esfera -->
  <circle cx="32" cy="32" r="20" fill="url(#body)" />
  <path d="M15 40 Q30 50 49 38" fill="none" stroke="url(#arc)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#rim)" stroke-width="2" />
  <ellipse cx="42" cy="19" rx="6" ry="4" fill="url(#shine)" transform="rotate(35 42 19)" />
</svg>
